<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="utf-8">
    <title>Заметочки</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Bilbo+Swash+Caps&family=Chiron+GoRound+TC:wght@200..900&family=Golos+Text:wght@400..900&family=Roboto+Mono:ital,wght@0,100..700;1,100..700&display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="notes" id="notes">
        <div class="note" id="note_1">
            <div class="note_title">
                <input type="text" name="note_title" value="" placeholder="Название заметки">
            </div>
            <div class="note_text">
                <textarea></textarea>
            </div>
            <div class="action">
                <img class="note_delete" src="delete.png" alt="">
                <img class="note_save" src="save.png" alt="" onclick="SaveNote(1)">
            </div>
        </div>
    </div>

    <button type="button" class="note_new" onclick="CreateNote()">+</button>




    <script>
        document.querySelector('textarea').addEventListener('input', function () {
            this.style.height = 'auto';
            this.style.height = `${this.scrollHeight}px`;
        });

        let note = 1;
        const conteiner = document.getElementById('notes');

        function CreateNote() {
            note++;
            let note_content = `
            <div class="note_title">
                <input type="text" name="note_title" value="" placeholder="Название заметки">
            </div>
            <div class="note_text">
                <textarea></textarea>
            </div>
            <div class="action">
                <img class="note_delete" src="delete.png" alt="">
                <img class="note_save" src="save.png" alt="" onclick="SaveNote(`+ note + `)">
            </div>
            `;
            const newNote = document.createElement('div')
            newNote.classList.add('note');
            newNote.id = 'note_' + note;
            newNote.innerHTML = note_content;
            conteiner.appendChild(newNote);
        }

        function SaveNote(event) {

            let note = document.querySelector('#note_' + event);

            const id = note.dataset.id;
            let title = note.querySelector('.note_title input').value;
            let text = note.querySelector('.note_text textarea').value;

            let noteData = {
                id: id,
                title: title,
                text: text
            };

            localStorage.setItem(`note-${id}`, JSON.stringify(noteData));
        }

        function loadNotes() {
            document.querySelectorAll('.note').forEach(note => {
                const id = note.dataset.id;

                const savedNote = localStorage.getItem(`note-${id}`);

                if (savedNote) {
                    const noteData = JSON.parse(savedNote);

                    note.querySelector('.note_title input').value = noteData.title;
                    note.querySelector('.note_text textarea').value = noteData.text;
                }
            });
        }

        loadNotes();

    </script>
</body>

</html>
