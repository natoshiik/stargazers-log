<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="utf-8">
    <title>Заметочки</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Bilbo+Swash+Caps&family=Chiron+GoRound+TC:wght@200..900&family=Golos+Text:wght@400..900&family=Roboto+Mono:ital,wght@0,100..700;1,100..700&display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="notes" id="notes">
        <div class="note" id="note_1" data-id="1">
            <div class="note_title">
                <p></p>
                <input type="text" name="note_title" value="" placeholder="Название заметки">
            </div>
            <div class="note_text">
                <textarea></textarea>
            </div>
            <div class="action">
                <img class="note_delete" src="delete.png" alt="">
                <img class="note_save" src="save.png" alt="" onclick="SaveNote(1)">
            </div>
        </div>
        <button type="button" class="note_new" onclick="CreateNote()">+</button>
    </div>

    
    <script>

        let note = 1;
        const conteiner = document.getElementById('notes');

        //Создание заметки
        function CreateNote(id = null, title = '', text = '', dateStr = '') {

            if (id === null) {
                note++;
                id = note;
            } else {
                note = Math.max(note, Number(id));
            }
            
            let note_content = `
        <div class="note_title">
            <p>${dateStr}</p>
            <input 
                type="text" 
                name="note_title" 
                value="${title}" 
                placeholder="Название заметки"
            >
        </div>
        <div class="note_text">
            <textarea>${text}</textarea>
        </div>

        <div class="action">
            <img class="note_delete" src="delete.png" alt=""
            onclick="deleteNote(${id})"
            >
            <img 
                class="note_save" 
                src="save.png" 
                alt="" 
                onclick="SaveNote(${id})"
            >
        </div>

    `;

            const newNote = document.createElement('div');

            newNote.classList.add('note');

            newNote.id = 'note_' + id;
            newNote.dataset.id = id;
            newNote.innerHTML = note_content;
            conteiner.prepend(newNote);

        }

        //СОхранение заметки
        function SaveNote(id) {

            let note = document.querySelector('#note_' + id);
            let time = document.querySelector('p');
            let now = new Date();
            let dateStr = now.toLocaleDateString('ru-RU') + ', ' + String(now.getHours()).padStart(2, '0')+':'+ String(now.getMinutes()).padStart(2, '0');
            time.innerHTML = dateStr;
            let title = note.querySelector('.note_title input').value;
            let text = note.querySelector('.note_text textarea').value;

            let noteData = {
                id: id,
                title: title,
                text: text,
                time: dateStr
            };

            localStorage.setItem(`note-${id}`, JSON.stringify(noteData));
            console.log(localStorage.getItem(`note-${id}`));
        }

        //Поиск и загрузка всех сохраненных заметок
        function loadNotes() {

            for (let i = 0; i < localStorage.length; i++) {

                const key = localStorage.key(i);
                console.log(key);
                if (key == 'note-undefined') continue;
                //if (!key.startsWith('note-')) continue;
                console.log(i);

                const savedNote = localStorage.getItem(key);
                const noteData = JSON.parse(savedNote);

                const existingNote = document.querySelector(
                    '#note_' + noteData.id
                );

                if (existingNote) {

                    // Если заметка уже есть в HTML
                    existingNote.querySelector('.note_title input').value =
                        noteData.title;

                    existingNote.querySelector('.note_text textarea').value =
                        noteData.text;

                } else {

                    // Если заметки нет — создаём её
                    CreateNote(
                        noteData.id,
                        noteData.title,
                        noteData.text,
                        noteData.time
                    );
                }
            }

        }

        loadNotes();

        //Блок растягивался по содержимому
        const textareas = document.querySelectorAll('textarea');

        textareas.forEach(textarea => {
            const setHeight = () => {
                textarea.style.height = 'auto';
                textarea.style.height = `${textarea.scrollHeight}px`;
            };


            setHeight();

            textarea.addEventListener('input', setHeight);
            textarea.addEventListener('scroll', setHeight);
        });

        function deleteNote(id) {
            let key = localStorage.key(`note-${id}`)
            localStorage.removeItem(key);
            const element = document.getElementById('note_' + id);
            element.remove();
        }
    </script>
</body>

</html>
