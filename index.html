<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="utf-8">
    <title>Заметочки</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Bilbo+Swash+Caps&family=Chiron+GoRound+TC:wght@200..900&family=Golos+Text:wght@400..900&family=Roboto+Mono:ital,wght@0,100..700;1,100..700&display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="note" id="note_1">
        <div class="note_title">
            <input type="text" name="note_title" id="title" value="" placeholder="Название заметки">
        </div>
        <div class="note_text">
            <textarea></textarea>
        </div>
        <div class="action">
            <img class="note_delete" src="delete.png" alt="">
            <img class="note_save" src="save.png" alt="">
        </div>
    </div>
    <button type="button" class="note_new">+</button>

    <script>
        document.querySelector('textarea').addEventListener('input', function () {
            this.style.height = 'auto';
            this.style.height = `${this.scrollHeight}px`;
        });
    </script>
</body>
  
</html>
